
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_to_ecr:
        description: Push image to ECR and deploy to Kubernetes
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Stage 1: Test the application
  test:
    name: "1. Test Application"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  # Stage 2: Build the Docker image (no local Docker required)
  build:
    name: "2. Build Docker Image"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: devops-assessment:${{ github.sha }}

  # Stage 3: Push the image to Amazon ECR
  push-to-ecr:
    name: "3. Push Image to ECR"
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_to_ecr &&
      github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

  
  # Stage 4: Deploy to Amazon EKS
  deploy-to-kubernetes:
    name: "4. Deploy to Kubernetes"
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_to_ecr &&
      github.ref == 'refs/heads/main' &&
      vars.EKS_CLUSTER_NAME != ''
    needs: push-to-ecr
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Set ECR image URI
        run: |
          echo "ECR_IMAGE_URI=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Deploy to Kubernetes
        run: |
          envsubst '${ECR_IMAGE_URI}' \
            < k8s/deployment.yaml \
            | kubectl apply -f -

          kubectl apply -f k8s/service.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status \
            deployment/devops-assessment \
            --timeout=180s

          kubectl get pods
          kubectl get services
